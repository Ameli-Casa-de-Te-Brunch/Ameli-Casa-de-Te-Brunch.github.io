name: Build y publicar menú

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA, no por tag (una tag se puede re-apuntar;
      # un SHA no) — endurecimiento estándar recomendado por GitHub para
      # workflows con permisos de escritura (acá: pages: write).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verificar que data/menu.json esté presente
        run: |
          test -f data/menu.json || {
            echo "Falta data/menu.json. El Excel maestro vive fuera del repo (a propósito)";
            echo "y se publica corriendo 'python build.py --publicar' en la PC del dueño,";
            echo "no desde acá.";
            exit 1;
          }
      # CI solo renderiza: no tiene (ni debe tener) el Excel maestro, así que
      # nunca corre extract.py ni validate.py — eso pasa en la PC del dueño.
      - run: python build/render.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
