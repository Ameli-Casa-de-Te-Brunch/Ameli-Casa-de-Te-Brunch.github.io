name: Build y publicar menú

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lo dispara el Apps Script de la hoja de disponibilidad cada vez que el
  # personal cambia un estado (ver build/aplicar_disponibilidad.py y el
  # README, sección "Disponibilidad en vivo"). No necesita el Excel: solo
  # re-renderiza data/menu.json (ya commiteado) con la disponibilidad nueva.
  repository_dispatch:
    types: [actualizar-disponibilidad]

# Mínimo privilegio por job, no un solo bloque global que todos heredan:
# el job `build` descarga la hoja de disponibilidad y procesa datos --
# no tiene ningún motivo para poder publicar. Solo `deploy` necesita
# `pages: write` / `id-token: write`, y los tiene únicamente él.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # false = la pestaña del calendario tenía errores y NO se aplicó (ver el
      # paso 'Aplicar calendario de temas' y el job avisar-hojas).
      calendario_ok: ${{ steps.calendario.outputs.calendario_ok }}
      # false = la pestaña de precios tenía errores y NO se aplicó (ver el paso
      # 'Aplicar precios' y el job avisar-hojas).
      precios_ok: ${{ steps.precios.outputs.precios_ok }}
      # false = la pestaña de productos tenía filas que NO se aplicaron (ver el paso
      # 'Aplicar productos' y el job avisar-hojas).
      productos_ok: ${{ steps.productos.outputs.productos_ok }}
    steps:
      # Actions fijadas por SHA, no por tag (una tag se puede re-apuntar;
      # un SHA no) — endurecimiento estándar recomendado por GitHub,
      # sobre todo para el job deploy más abajo, que sí tiene permisos
      # de escritura (pages: write / id-token: write). Este job (build)
      # corre con solo contents: read -- descarga y procesa la hoja de
      # disponibilidad, no publica nada.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verificar que data/menu.json esté presente
        run: |
          test -f data/menu.json || {
            echo "Falta data/menu.json. El Excel maestro vive fuera del repo (a propósito)";
            echo "y se publica corriendo 'python build.py --publicar' en la PC del dueño,";
            echo "no desde acá.";
            exit 1;
          }
      # Pruebas y validación de integridad primero, sin red y sin
      # dependencias (todo lo que tocan estos tests es stdlib puro) -- si
      # algo de esto falla, ni se intenta tocar la hoja de disponibilidad
      # ni renderizar.
      - name: Ejecutar pruebas automáticas
        run: python -m unittest discover -s tests -v
      - name: Validar data/menu.json (antes de disponibilidad)
        run: python build/validate_json_publico.py data/menu.json
      # CI solo renderiza: no tiene (ni debe tener) el Excel maestro, así que
      # nunca corre extract.py ni validate.py — eso pasa en la PC del dueño.
      # DISPONIBILIDAD_CSV_URL es una repo variable, no un secreto: es una
      # URL "publicada en la web", pública por diseño de Google Sheets.
      # Este paso es OBLIGATORIO y ESTRICTO en este camino (a diferencia de
      # build.py en la PC del dueño, donde sigue siendo opcional): si la
      # variable no está configurada, si la hoja no responde, redirige a un
      # destino no permitido, o el contenido no es confiable (valor
      # desconocido, ID duplicado/desconocido, producto activo sin fila,
      # hoja vacía/truncada, codificación inválida, o excede el tamaño
      # máximo), este paso falla y el job entero se corta acá -- nunca se
      # llega a renderizar ni a publicar, así que GitHub Pages conserva la
      # última versión publicada con éxito. Antes de esta corrección, una
      # variable vacía/faltante terminaba "con éxito" sin aplicar nada, lo
      # que podía publicar todo como disponible sin que nadie se entere.
      - name: Aplicar disponibilidad en vivo (obligatoria; modo estricto)
        env:
          DISPONIBILIDAD_CSV_URL: ${{ vars.DISPONIBILIDAD_CSV_URL }}
        run: python build/aplicar_disponibilidad.py
      # Precios (y tipos de cambio) desde una pestaña de Google Sheets publicada
      # -- ver build/aplicar_precios.py y docs/operations/PRECIOS_SHEETS.md.
      # PRECIOS_CSV_URL es una repo variable (no un secreto: los precios del
      # menú son públicos). Igual que el calendario, NO es fail-closed: un error
      # de la hoja no puede impedir que se publique un 'agotado por hoy'. Con
      # cualquier problema (producto ausente, un cero de más, un tamaño
      # agregado...) no se aplica NADA, quedan los precios de data/menu.json, el
      # paso termina bien con precios_ok=false y el job avisar-hojas pone la
      # corrida en rojo DESPUÉS de publicar. Va antes de la validación de abajo
      # para que se valide el JSON exacto que se publica.
      - name: Aplicar precios desde la hoja (con respaldo)
        id: precios
        env:
          PRECIOS_CSV_URL: ${{ vars.PRECIOS_CSV_URL }}
        run: python build/aplicar_precios.py
      # Columnas de producto del Excel maestro (Producto activo, Destacado, Recomendado,
      # Más vendido, Nuevo, Edición limitada, Etiqueta inicial) desde una pestaña de
      # Google Sheets -- ver build/aplicar_productos.py y
      # docs/operations/PRODUCTOS_SHEETS.md. PRODUCTOS_CSV_URL es una repo variable (no un
      # secreto). Acá cada fila es independiente: una fila mala no frena las demás, pero
      # marca productos_ok=false y el job avisar-hojas pone la corrida en rojo DESPUÉS de
      # publicar. La hoja nunca puede publicar un producto que el Excel tiene en pausa.
      - name: Aplicar productos desde la hoja (con respaldo)
        id: productos
        env:
          PRODUCTOS_CSV_URL: ${{ vars.PRODUCTOS_CSV_URL }}
        run: python build/aplicar_productos.py
      # Se valida de nuevo DESPUÉS de aplicar disponibilidad, precios y productos: los
      # pasos anteriores reescriben data/menu.json en disco, así que esta corrida
      # revisa el JSON exacto que se va a renderizar y publicar, no el que
      # había antes de pisarlo con la hoja en vivo.
      - name: Validar data/menu.json (después de disponibilidad, antes de publicar)
        run: python build/validate_json_publico.py data/menu.json
      # Calendario de temas (Halloween, Navidad, etc.) desde una pestaña de
      # Google Sheets publicada -- ver build/aplicar_calendario.py y
      # docs/operations/TEMAS_Y_CALENDARIO.md. CALENDARIO_CSV_URL es una repo
      # variable (no un secreto: URL pública por diseño al publicar la hoja).
      # A DIFERENCIA de la disponibilidad, este paso NO es fail-closed: un
      # calendario roto no puede impedir que se publique un 'agotado por hoy'.
      # Si la hoja tiene errores, no se pisa nada (queda el data/calendario.json
      # commiteado, el último válido), el paso termina bien con
      # calendario_ok=false y el job avisar-calendario, más abajo, pone la
      # corrida en rojo DESPUÉS de publicar, para que llegue el mail de GitHub.
      - name: Aplicar calendario de temas desde la hoja (con respaldo)
        id: calendario
        env:
          CALENDARIO_CSV_URL: ${{ vars.CALENDARIO_CSV_URL }}
        run: python build/aplicar_calendario.py
      # build_unificado.py corre build/render.py con los mismos
      # argumentos de siempre y ADEMÁS genera la web institucional en
      # la raíz de dist/ -- ver build_unificado.py en la raíz del
      # repo. No cambia nada de la validación/disponibilidad de los
      # pasos anteriores. Es el flujo vigente de producción.
      - run: python build_unificado.py --production
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Corre solo si una hoja (calendario, precios o productos) tenía errores. El sitio YA se
  # publicó (con el último calendario y los últimos precios válidos y la
  # disponibilidad al día); acá solo se marca la corrida como fallida para que
  # alguien se entere y lo corrija. No necesita ningún permiso.
  avisar-hojas:
    needs: [build, deploy]
    if: ${{ always() && (needs.build.outputs.calendario_ok == 'false' || needs.build.outputs.precios_ok == 'false' || needs.build.outputs.productos_ok == 'false') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::Una hoja de la planilla (calendario, precios o productos) tiene errores y NO se aplicó (en precios y productos, solo las filas con error; las demás sí se aplicaron). El sitio se publicó igual, con lo último que era válido. Mirá los pasos 'Aplicar calendario de temas', 'Aplicar precios' y 'Aplicar productos' del job build para ver qué fila corregir."
          exit 1
