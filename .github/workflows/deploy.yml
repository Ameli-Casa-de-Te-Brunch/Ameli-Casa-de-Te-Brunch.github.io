name: Build y publicar menú

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lo dispara el Apps Script de la hoja de disponibilidad cada vez que el
  # personal cambia un estado (ver build/aplicar_disponibilidad.py y el
  # README, sección "Disponibilidad en vivo"). No necesita el Excel: solo
  # re-renderiza data/menu.json (ya commiteado) con la disponibilidad nueva.
  repository_dispatch:
    types: [actualizar-disponibilidad]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA, no por tag (una tag se puede re-apuntar;
      # un SHA no) — endurecimiento estándar recomendado por GitHub para
      # workflows con permisos de escritura (acá: pages: write).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verificar que data/menu.json esté presente
        run: |
          test -f data/menu.json || {
            echo "Falta data/menu.json. El Excel maestro vive fuera del repo (a propósito)";
            echo "y se publica corriendo 'python build.py --publicar' en la PC del dueño,";
            echo "no desde acá.";
            exit 1;
          }
      # CI solo renderiza: no tiene (ni debe tener) el Excel maestro, así que
      # nunca corre extract.py ni validate.py — eso pasa en la PC del dueño.
      # Sí puede pisar la disponibilidad con lo que diga la hoja de Sheets
      # (DISPONIBILIDAD_CSV_URL es una repo variable, no un secreto: es una
      # URL "publicada en la web", pública por diseño de Google Sheets) —
      # no falla el build si no está configurada o no responde.
      - name: Aplicar disponibilidad en vivo (si está configurada)
        env:
          DISPONIBILIDAD_CSV_URL: ${{ vars.DISPONIBILIDAD_CSV_URL }}
        run: python build/aplicar_disponibilidad.py
      - run: python build/render.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
